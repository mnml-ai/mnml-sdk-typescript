name: Release

# Publishes to npm when a GitHub release is published (tag `v<version>`), with npm
# trusted publishing: no token is stored, and the package carries provenance.
# One-time setup on npmjs.com: the package's Settings → Trusted publisher →
# GitHub Actions, repository mnml-ai/mnml-sdk-typescript, workflow release.yml,
# environment npm.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: The tag matches the package version
        run: |
          test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"
          grep -q "VERSION = '$(node -p 'require("./package.json").version')'" src/client.ts
      # prepublishOnly runs the typecheck, the tests and the build.
      - run: npm publish --access public --provenance
